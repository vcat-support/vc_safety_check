<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="vcsafetycheck-summary d-flex justify-content-between flex-grow-1">
    <f:for each="{severityCounts}" as="severityCount">
        <div data-severity="{severityCount.severity}"
             data-vcsafetycheck-info="{f:translate(key: 'LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.severity.info.{severityCount.severityColor}')}"
             data-vcsafetycheck-action="{f:if(condition: severityCount.count, then: 'filter')}"
             role="{f:if(condition: severityCount.count, then: 'button')}"
             tabindex="{f:if(condition: severityCount.count, then: '0', else: '-1')}"
             class="summary-box flex-grow-1 d-flex justify-content-between {severityCount.severityClass}{f:if(condition: severityCount.count, else: ' is-empty')}">
            <div class="left-part">
                <span class="fontsize-normal"><strong><f:translate key="LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.severity.label.{severityCount.severityColor}" default="{severityCount.severity}"/></strong></span><br/>
                <span class="fontsize-big color-black"><strong>{severityCount.count}</strong></span>
            </div>
            <div class="right-part d-flex flex-column justify-content-around">
                <span class="vc-icon color-{severityCount.severityColor}">
                    <f:if condition="{severityCount.severity} === 'HIGH' || {severityCount.severity} === 'CRITICAL'">
                        <f:then>
                            <core:icon identifier="actions-exclamation-triangle-alt" size="large" />
                        </f:then>
                        <f:else>
                            <core:icon identifier="actions-exclamation-circle-alt" size="large" />
                        </f:else>
                    </f:if>
                </span>
            </div>
        </div>
    </f:for>
</div>
</html>
