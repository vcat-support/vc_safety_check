<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="vcsafetycheck-system-status toggle-security-table">
    <div class="row">
        <div class="col-2 d-flex flex-column justify-content-around">
            <span class="vc-icon color-{systemStatus.severityColor} size-ultra">
                <core:icon identifier="actions-shield-typo3" size="mega" />
            </span>
        </div>
        <div class="col-9">
            <div class="fontsize-normal">
                <span>
                    <f:translate key="LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.status.title"/>
                </span>
            </div>
            <f:if condition="{systemStatus.severity}">
                <div class="vcsafetycheck-status-message fontsize-big">
                    <span class="{systemStatus.severityClass}">
                        <f:switch expression="{systemStatus.severityColor}">
                            <f:case value="critical">
                                <f:translate key="LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.status.state.critical"/>
                            </f:case>
                            <f:case value="high">
                                <f:translate key="LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.status.state.high"/>
                            </f:case>
                            <f:case value="moderate">
                                <f:translate key="LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.status.state.moderate"/>
                            </f:case>
                            <f:case value="low">
                                <f:translate key="LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.status.state.low"/>
                            </f:case>
                            <f:case value="ok">
                                <f:translate key="LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.status.state.ok"/>
                            </f:case>
                            <f:defaultCase>
                                <f:translate key="LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.status.state.unknown"/>
                            </f:defaultCase>
                        </f:switch>
                    </span>
                </div>
            </f:if>
            <div class="fontsize-normal">
                <span><strong>
                    <f:translate key="LLL:EXT:vc_safety_check/Resources/Private/Language/locallang.xlf:widget.meta.vulnerabilities_found"
                                 arguments="{0: total}"/>
                </strong></span>
            </div>
        </div>
        <div class="col-1 d-flex flex-column justify-content-around">
            <span class="vc-icon">
                <core:icon identifier="actions-arrow-right" size="large" />
            </span>
        </div>
    </div>
</div>
</html>
